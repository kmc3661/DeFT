name: Apply final DeFT source release
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-deft-final.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match public source to final local release
        env:
          GIT_AUTHOR_NAME: Minchan Kang
          GIT_AUTHOR_EMAIL: 67529114+kmc3661@users.noreply.github.com
          GIT_COMMITTER_NAME: Minchan Kang
          GIT_COMMITTER_EMAIL: 67529114+kmc3661@users.noreply.github.com
        run: |
          set -euo pipefail
          unzip -oq deft_final_update_20260928.zip
          git rm -- SHA256SUMS.json configs/infovqa_latency_100.jsonl configs/paper.json docs/REPRODUCIBILITY.md docs/VALIDATION.md docs/gpu_caption_validation.json docs/gpu_smoke_validation.json docs/source_manifest.json tests/test_release.py tools/build_github_source.py tools/build_supplement.py tools/measure_latency.py
          rm deft_final_update_20260928.zip .github/workflows/apply-deft-final.yml
          rmdir .github/workflows .github
          git add -A
          test "$(git ls-files | wc -l)" -eq 45
          git commit -m "Finalize DeFT public source release"
          git push origin HEAD:main
